<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#3584e4"/>

  <!-- Lock body (rounded rectangle) -->
  <rect x="32" y="58" width="64" height="46" rx="8" ry="8" fill="white"/>

  <!-- Lock shackle -->
  <path d="M 44 58 L 44 40 A 20 20 0 0 1 84 40 L 84 58"
        fill="none" stroke="white" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Keyhole circle -->
  <circle cx="64" cy="79" r="8" fill="#3584e4"/>

  <!-- Keyhole stem -->
  <rect x="60" y="79" width="8" height="12" rx="2" fill="#3584e4"/>
</svg>
